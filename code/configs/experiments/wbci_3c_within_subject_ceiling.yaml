experiment:
  name: "phase1_baseline"
  source_config: "configs/experiments/phase1_baseline.yaml"

# =====================================================================
# WBCIC-SHU 3-class WITHIN-SESSION ceiling — is the hard subjects' signal there at all?
#
# WHY THIS RUN EXISTS
#   Cross-subject LOSO accuracy varies from 37.0% (sub-011, chance is 33.3%) to 87.1%
#   (sub-007) — a 50.1pp spread, versus only 6.2pp between the six models. Subject
#   variance is 45x model variance (docs/RESULTS_TRUTH.md). Every architecture we have
#   fails identically on sub-011 and sub-006, and ATCNet's advantage over the other five
#   models correlates +0.53 with how easy a subject already is: it gains +10.4pp on the
#   easiest subject and exactly 0.0pp on the two hardest.
#
#   Two explanations fit that pattern and they imply opposite next steps:
#     (a) DOMAIN SHIFT — the signal is there, the model just cannot transfer to it.
#         Then domain adaptation / adversarial invariance is the right family.
#     (b) SIGNAL QUALITY — the subject's MI is not decodable at all ("BCI illiteracy").
#         Then no amount of domain adaptation helps, and effort should go elsewhere.
#
#   Within-session stratified K-fold removes domain shift entirely: train and test come
#   from the same subject, same session, same day. It is the tightest available upper
#   bound on decodability. If sub-011 scores ~40% here, (b) is true and the cross-subject
#   line has a hard per-subject floor no method will lift. If it scores ~80%, (a) is true
#   and the 37% is genuinely a transfer failure worth attacking.
#
#   This is the single cheapest experiment that tells us whether adversarial training is
#   even aimed at the right problem.
#
# PROTOCOL  within-session only (no cross-session arm — drift is not the question here).
#   11 subjects x 3 sessions x 5 folds = 165 cells per model. Each cell trains on ~240
#   trials, so cells are seconds-to-a-minute, not hours.
#
# READ THE RESULT PER SUBJECT, NOT AS A MEAN. The mean is meaningless here; the whole
#   point is the per-subject spread, especially sub-011 and sub-006.
#
# Run:
#   sbatch -J ceil scripts/slurm/shu_gpu.sbatch \
#     code/configs/experiments/wbci_3c_within_subject_ceiling.yaml
# =====================================================================

run_id: "wbci_3c_within_ceiling_v1"

data:
  name: "wbci_shu_3c"
  variant: "mat_clean_3c"
  manifest: "wbci_3c_processed_manifest"
  status_filter: ["ok"]
  n_channels: 58
  n_times: 1000
  n_classes: 3
  sfreq: 250

protocols: ["within"]
models: ["eegnet_official", "atcnet"]

within:
  folds: 5

train:
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0
  optimizer: "adam"
  max_epochs: 100
  early_stopping_patience: 20
  early_stopping_metric: "val_loss"
  val_fraction: 0.2
  num_workers: 2
  device: "cuda"
  seeds: [0]

model_params:
  eegnet_official: {dropoutRate: 0.5, kernLength: 64, F1: 8, D: 2, F2: 16, norm_rate: 0.25}
  atcnet: {eegn_F1: 16, eegn_D: 2, eegn_kernelSize: 64, eegn_poolSize: 7,
           eegn_dropout: 0.3, attention: "mha",
           tcn_depth: 2, tcn_kernelSize: 4, tcn_filters: 32, tcn_dropout: 0.3,
           n_windows: 5, fuse: "average", use_official_l2: true}

eval:
  metrics: ["accuracy", "balanced_accuracy", "macro_f1", "auc"]
  calibration_metrics: ["nll", "brier", "ece"]

output:
  output_dir: "outputs/experiments/wbci_shu/wbci_3c_within_ceiling_v1"
  checkpoint_dir: "checkpoints/wbci_shu/wbci_3c_within_ceiling_v1"
