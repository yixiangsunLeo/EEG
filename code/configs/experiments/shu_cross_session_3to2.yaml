experiment:
  name: "cross_session_e2e"
  source_config: "configs/experiments/shu_cross_session_3to2.yaml"

# =====================================================================
# SHU 2022 — CROSS-SESSION (subject-specific), 3 sessions train -> 2 sessions test.
#
# One model per subject: train on ses-01+02+03, test on ses-04+05 of the SAME subject.
# 25 subjects x 7 models x 1 seed = 175 cells.
#
# PROTOCOL PROVENANCE — read before comparing to any published number:
#   The recipe below is the SHU 2022 dataset paper's (Ma et al., Sci Data 9:531,
#   doi:10.1038/s41597-022-01647-1), quoted from its Technical Validation section:
#     "the batch size was 16, the learning rate was 0.001, maximum iteration times was
#      1500 epoch, loss function was 'NLLLoss', and optimizer was 'Adam'. Training would
#      stop when the classification accuracy on the validation set stopped improving.
#      The preprocessed data were directly used."
#   TWO DELIBERATE DEVIATIONS (advisor, 2026-08-16):
#     1. SPLIT. The paper's CS trains on ses-01 ONLY and tests on ses-02..05 ("In CS, the
#        data in the first session was used as the training set, and the data in the
#        remaining four sessions of the same subject were used as the test set"). We train
#        on THREE sessions instead, so the training pool grows from ~96 to ~286 trials.
#        => Our numbers are NOT comparable to the paper's CS 53.7%. Do not report this run
#           as "beating the paper"; it is a different, easier protocol.
#     2. EPOCHS. 300 instead of the paper's 1500 (early stopping makes the cap moot in
#        practice, but the deviation is recorded here rather than hidden).
#   Everything else follows the paper: Adam, lr 1e-3, batch 16, early stopping on
#   validation ACCURACY, and no extra normalization on top of the released data.
#
# VALIDATION SLICE. The paper never states a val proportion for CS (its CS section only
#   says the train/test sets changed). Its own within-session benchmark splits 8:1:1, so
#   we carve the same 8:1 train:val ratio out of the pooled training sessions:
#   val_fraction = 1/9 -> ~254 train / ~32 val per subject (pool is 239-300 trials).
#
# CURVES. Per-epoch train / val / test accuracy are logged for the 3-curve figure. The
#   test curve pools ses-04+05 into one line and is MONITORING ONLY: best.pt and early
#   stopping read the val loader alone (guard in code/training/e2e_trainer.py).
#   Per-test-session metrics (s4 / s5 separately, as the paper reports) are computed
#   after training and stored in each cell's result.json.
#
# Run (GPU / Slurm; never on the login node):
#   python code/run.py --dry-run --config code/configs/experiments/shu_cross_session_3to2.yaml
#   bash scripts/slurm/submit_shu_cross_session.sh
# =====================================================================

run_id: "shu_cross_session_3to2_v1"

data:
  name: "shu"
  manifest: "shu_processed_manifest"
  status_filter: ["ok"]
  n_channels: 32
  n_times: 1000                  # 4 s trial @ 250 Hz (author-provided epochs)
  n_classes: 2
  sfreq: 250

models: ["eegnet_official", "eegnex", "eeg_deformer", "atcnet",
         "deepconvnet", "fbcnet", "s4erp"]

cross_session:
  train_sessions: ["ses-01", "ses-02", "ses-03"]
  test_sessions: ["ses-04", "ses-05"]

train:
  # ---- SHU 2022 paper recipe: do not "improve" these ----
  optimizer: "adam"
  lr: 0.001
  batch_size: 16
  max_epochs: 300                 # deviation: paper says 1500
  weight_decay: 0.0               # not stated in the paper
  scheduler: "none"               # not stated in the paper
  grad_clip_norm: 0.0             # not stated in the paper
  normalization: "none"           # paper: "the preprocessed data were directly used"
  # ---- early stopping: paper stops on validation accuracy ----
  monitor: "accuracy"
  monitor_mode: "max"
  early_stopping_patience: 25     # not stated in the paper (advisor's choice)
  val_fraction: 0.1111            # 1/9 -> 8:1 train:val, matching the paper's 8:1:1 WS
  # ---- shared so the table is comparable ----
  num_workers: 2
  amp: false
  device: "cuda"
  seeds: [0]
  # ---- per-epoch train/val/test curves (monitoring only) ----
  curves: true
  train_eval_max_trials: 2000     # training pool is ~254 trials, so never capped

model_params:
  # ===== published baselines: upstream author defaults, NOT tuned =====
  eegnet_official: {dropoutRate: 0.5, kernLength: 64, F1: 8, D: 2, F2: 16, norm_rate: 0.25}
  eegnex: {}                       # upstream exposes no structural hyperparameters
  eeg_deformer: {temporal_kernel: 51, num_kernel: 64, deformer_depth: 4,
                 heads: 16, mlp_dim: 16, dim_head: 16, deformer_dropout: 0.25}
  atcnet: {eegn_F1: 16, eegn_D: 2, eegn_kernelSize: 64, eegn_poolSize: 7,
           eegn_dropout: 0.3, attention: "mha",
           tcn_depth: 2, tcn_kernelSize: 4, tcn_filters: 32, tcn_dropout: 0.3,
           n_windows: 5, fuse: "average", use_official_l2: true}
  # ===== this project's Phase 0-2c baselines (same params as shu_phase1_baseline) =====
  deepconvnet: {dropout: 0.5, n_filters_1: 25}
  fbcnet: {n_bands: 9, band_width: 4, f_low: 4, f_high: 40, m: 32,
           temporal_segments: 4, dropout: 0.5}
  # ===== ours =====
  s4erp: {d_model: 128, n_layers: 4, state_dim: 8, d_ff: 256, dropout: 0.1}

eval:
  metrics: ["accuracy", "balanced_accuracy", "macro_f1", "auc"]
  calibration_metrics: ["nll", "brier", "ece"]
  report_scope: "per_test_session"

checkpoints:
  keep: ["best", "last"]
  resume: true

output:
  output_dir: "outputs/experiments/shu/cross_session_3to2_v1"
  checkpoint_dir: "checkpoints/shu/cross_session_3to2_v1"
