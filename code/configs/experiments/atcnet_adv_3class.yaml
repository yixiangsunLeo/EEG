experiment:
  name: foundation_cross_subject
  source_config: "configs/experiments/foundation_cross_subject_3class.yaml"

# =====================================================================
# ATCNet vs ATCNet-Adv — does domain-adversarial training help the STRONGEST backbone?
#
# WHY THIS RUN EXISTS
#   The only adversarial evidence we have is on S4ERP (docs/RESULTS_TRUTH.md §6):
#   64.68% -> 67.60%, +2.92pp. But S4ERP is also the worst overfitter in the table
#   (train-val gap +32.7pp), so the gain may just be regularisation of a bad backbone.
#   ATCNet is the strongest model under this recipe (70.85%) and overfits far less
#   (+22.1pp), so if adversarial training still helps here, the effect is real and
#   backbone-independent. If it does not, that is equally informative.
#
# WHY BOTH ARMS RUN HERE
#   `atcnet` already has 11 folds in foundation_cross_subject_3class_v1 under a
#   byte-identical recipe and the same deterministic split (split_seed 0). Re-running it
#   costs 3.6 h and buys two things: a same-run paired control, and a regression check
#   that the 2026-08-25 trainer changes (3-tuple batch unpacking) left non-adversarial
#   behaviour untouched. Expect atcnet to reproduce 70.85%; if it does not, stop and
#   investigate before reading the adversarial arm.
#
# RECIPE  Identical to foundation_cross_subject_3class.yaml. Do not "improve" it here or
#   the paired comparison with the existing ATCNet cells is lost.
#
# COST  atcnet 0.33 h/fold, atcnet_adv ~0.4 h/fold -> ~8 h for both arms, 11 folds.
#
# Run:
#   sbatch -J atcadv scripts/slurm/shu_gpu.sbatch \
#     code/configs/experiments/atcnet_adv_3class.yaml
# =====================================================================

run_id: atcnet_adv_3class_v1

data:
  name: wbci_shu
  manifest: wbci_3c_processed_manifest
  status_filter: [ok]
  n_channels: 58
  n_times: 1000
  n_classes: 3
  sfreq: 250

models: [atcnet, atcnet_adv]

cross_subject:
  protocol: loso
  n_folds: 11
  split_seed: 0
  val_mode: subjects
  val_subject_fraction: 0.15

train:
  batch_size: 64
  lr: null
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  max_epochs: 100
  early_stopping_patience: 25
  monitor: macro_f1
  monitor_mode: max
  grad_clip_norm: 4.0
  normalization: per_sample_zscore
  num_workers: 2
  amp: false
  device: cuda
  seeds: [0]
  # ATCNet's best epoch under this recipe is 44.8 of 100, so the three curves are cheap
  # here and let us see whether the adversarial arm converges on a different schedule.
  curves: true
  train_eval_max_trials: 2000

model_params:
  atcnet: {}
  atcnet_adv: {n_subjects: 11, lambda_adv: 1.0, adv_warmup_epochs: 5,
               adv_ramp_epochs: 50, adv_hidden: 64, adv_tap: "conv"}

eval:
  metrics: [accuracy, balanced_accuracy, macro_f1, auc]
  calibration_metrics: [nll, brier, ece]
  report_scope: per_test_subject

checkpoints:
  keep: [best, last]
  resume: true

output:
  output_dir: outputs/experiments/wbci_shu/atcnet_adv_3class_v1
  checkpoint_dir: checkpoints/wbci_shu/atcnet_adv_3class_v1
