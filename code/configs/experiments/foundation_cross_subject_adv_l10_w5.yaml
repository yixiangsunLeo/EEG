checkpoints:
  keep:
  - best
  - last
  resume: true
cross_subject:
  n_folds: 11
  protocol: loso
  split_seed: 0
  val_mode: subjects
  val_subject_fraction: 0.15
data:
  manifest: wbci_3c_processed_manifest
  n_channels: 58
  n_classes: 3
  n_times: 1000
  name: wbci_shu
  sfreq: 250
  status_filter:
  - ok
  variant: eog_ecg_clean
eval:
  calibration_metrics:
  - nll
  - brier
  - ece
  metrics:
  - accuracy
  - balanced_accuracy
  - macro_f1
  - auc
  report_scope: per_test_subject
experiment:
  name: foundation_cross_subject
  source_config: configs/experiments/foundation_cross_subject.yaml
model_params:
  dualcd_s4_flatten:
    d_ff: 256
    d_model: 128
    dino_out_dim: 256
    dropout: 0.1
    lambda_intra: 0.5
    n_layers: 4
    proto_k: 5
    state_dim: 8
    teacher_momentum: 0.996
    view_high_band:
    - 13.0
    - 30.0
    view_low_band:
    - 8.0
    - 13.0
    warmup_epochs: 5
  dualcd_s4_pos:
    d_ff: 256
    d_model: 128
    dino_out_dim: 256
    dropout: 0.1
    lambda_intra: 0.5
    n_layers: 4
    proto_k: 5
    state_dim: 8
    teacher_momentum: 0.996
    view_high_band:
    - 13.0
    - 30.0
    view_low_band:
    - 8.0
    - 13.0
    warmup_epochs: 5
  dualcd_s4_timepatch:
    bin_boundaries_ms:
    - 0
    - 500
    - 1000
    - 1500
    - 2000
    - 3000
    - 4000
    d_ff: 256
    d_model: 128
    dino_out_dim: 256
    dropout: 0.1
    lambda_intra: 0.5
    n_layers: 4
    proto_k: 5
    state_dim: 8
    teacher_momentum: 0.996
    use_std: true
    view_high_band:
    - 13.0
    - 30.0
    view_low_band:
    - 8.0
    - 13.0
    warmup_epochs: 5
  dualcd_transformer:
    d_ff: 256
    d_model: 128
    dino_out_dim: 256
    dropout: 0.1
    lambda_intra: 0.5
    n_heads: 8
    n_layers: 6
    proto_k: 5
    teacher_momentum: 0.996
    view_high_band:
    - 13.0
    - 30.0
    view_low_band:
    - 8.0
    - 13.0
    warmup_epochs: 5
  s4erp:
    d_ff: 256
    d_model: 128
    dropout: 0.1
    n_layers: 4
    state_dim: 8
  s4erp_adv:
    adv_warmup_epochs: 5
    d_ff: 256
    d_model: 128
    dropout: 0.1
    lambda_adv: 1.0
    n_layers: 4
    n_subjects: 11
    state_dim: 8
models:
- s4erp_adv
output:
  checkpoint_dir: checkpoints/wbci_shu/foundation_cross_subject_adv_l10_w5
  output_dir: outputs/experiments/wbci_shu/foundation_cross_subject_adv_l10_w5
run_id: foundation_cross_subject_adv_l10_w5
train:
  amp: false
  batch_size: 64
  device: cuda
  early_stopping_patience: 25
  grad_clip_norm: 4.0
  lr: null
  max_epochs: 100
  monitor: macro_f1
  monitor_mode: max
  normalization: per_sample_zscore
  num_workers: 2
  optimizer: adamw
  scheduler: cosine
  seeds:
  - 0
  weight_decay: 0.0001
