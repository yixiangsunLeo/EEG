experiment:
  name: "foundation_cross_subject"
  source_config: "configs/experiments/paper_baseline_3c_821.yaml"

# =====================================================================
# S4ERP-Adv under the 821 (DSGNet paper) recipe — the missing arm.
#
# WHY THIS RUN EXISTS
#   The +2.92% adversarial gain reported in docs/report_824_s4erp_adv_3class.md is measured
#   entirely inside foundation_cross_subject_3class_v1 (our recipe: AdamW / lr from model
#   default / batch 64 / 100 epochs / cosine / wd 1e-4 / clip 4.0 / patience 25):
#       s4erp 64.68%  ->  s4erp_adv 67.60%
#   But plain s4erp under the 821 paper recipe scores 68.26% — i.e. the RECIPE is worth
#   +3.58pp on this backbone, MORE than adversarial training is worth under our recipe.
#   Nobody has ever run s4erp_adv under the paper recipe, so we cannot tell whether the
#   adversarial gain survives a longer, gentler training budget or is just compensating
#   for our recipe's tight early stop.
#
#   This config is paper_baseline_3c_821.yaml with models=[s4erp_adv]. Every other knob is
#   byte-identical, so `s4erp` from paper_baseline_3c_821_v1 is the paired control and the
#   two runs share the same LOSO split (split_seed 0, val_mode subjects, n_val_subjects 2).
#
#   lambda_adv is pinned to 1.0 to match foundation_cross_subject_3class_v1, so the only
#   variable between the two adversarial cells is the recipe.
#
# COST  s4erp needed 1.05 h/fold under this recipe -> expect ~12 h for 11 folds on one GPU.
#
# Run:
#   sbatch -J adv821 scripts/slurm/shu_gpu.sbatch \
#     code/configs/experiments/adv_821recipe_3c.yaml
# =====================================================================

run_id: "adv_821recipe_3c_v1"

data:
  name: "wbci_shu_3c"
  variant: "mat_clean_3c"
  manifest: "wbci_3c_processed_manifest"
  status_filter: ["ok"]
  n_channels: 58
  n_times: 1000
  n_classes: 3
  sfreq: 250

models: ["s4erp_adv"]

cross_subject:
  protocol: "loso"
  n_folds: 11
  split_seed: 0
  val_mode: "subjects"
  n_val_subjects: 2

train:
  # ---- DSGNet paper recipe: identical to paper_baseline_3c_821.yaml ----
  optimizer: "adam"
  lr: 0.0001
  batch_size: 128
  max_epochs: 500
  weight_decay: 0.0
  scheduler: "none"
  grad_clip_norm: 0.0
  early_stopping_patience: 100
  monitor: "macro_f1"
  monitor_mode: "max"
  normalization: "per_sample_zscore"
  num_workers: 2
  amp: false
  device: "cuda"
  seeds: [0]
  curves: true
  train_eval_max_trials: 2000

model_params:
  s4erp_adv: {d_model: 128, n_layers: 4, state_dim: 8, d_ff: 256, dropout: 0.1,
              n_subjects: 11, lambda_adv: 1.0, adv_warmup_epochs: 5}

eval:
  metrics: ["accuracy", "balanced_accuracy", "macro_f1", "auc"]
  calibration_metrics: ["nll", "brier", "ece"]
  report_scope: "per_test_subject"

checkpoints:
  keep: ["best", "last"]
  resume: true

output:
  output_dir: "outputs/experiments/wbci_shu/adv_821recipe_3c_v1"
  checkpoint_dir: "checkpoints/wbci_shu/adv_821recipe_3c_v1"
