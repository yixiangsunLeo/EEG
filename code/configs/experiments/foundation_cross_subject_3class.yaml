experiment:
  name: foundation_cross_subject
run_id: foundation_cross_subject_3class_v1

data:
  name: wbci_shu
  manifest: wbci_3c_processed_manifest
  status_filter: [ok]
  n_channels: 58
  n_times: 1000
  n_classes: 3
  sfreq: 250

models: [eegnet_official, eegnex, eeg_deformer, atcnet, s4erp, s4erp_adv, dualcd_s4_flatten]

cross_subject:
  protocol: loso
  n_folds: 11
  split_seed: 0
  val_mode: subjects
  val_subject_fraction: 0.15

train:
  batch_size: 64
  lr: null
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  max_epochs: 100
  early_stopping_patience: 25
  monitor: macro_f1
  monitor_mode: max
  grad_clip_norm: 4.0
  normalization: per_sample_zscore
  num_workers: 2
  amp: false
  device: cuda
  seeds: [0]

model_params:
  eegnet_official: {}
  eegnex: {}
  eeg_deformer: {}
  atcnet: {}
  s4erp: {d_model: 128, n_layers: 4, state_dim: 8, d_ff: 256, dropout: 0.1}
  s4erp_adv: {d_model: 128, n_layers: 4, state_dim: 8, d_ff: 256, dropout: 0.1, n_subjects: 11, lambda_adv: 1.0, adv_warmup_epochs: 5}
  dualcd_s4_flatten: {d_model: 128, n_layers: 4, state_dim: 8, d_ff: 256, dropout: 0.1, lambda_intra: 0.5, dino_out_dim: 256, proto_k: 5, teacher_momentum: 0.996, warmup_epochs: 5, view_low_band: [8.0, 13.0], view_high_band: [13.0, 30.0]}
  dualcd_transformer: {d_model: 128, n_layers: 6, n_heads: 8, d_ff: 256, dropout: 0.1, lambda_intra: 0.5, dino_out_dim: 256, proto_k: 5, teacher_momentum: 0.996, warmup_epochs: 5, view_low_band: [8.0, 13.0], view_high_band: [13.0, 30.0]}

eval:
  metrics: [accuracy, balanced_accuracy, macro_f1, auc]
  calibration_metrics: [nll, brier, ece]
  report_scope: per_test_subject

checkpoints:
  keep: [best, last]
  resume: false

output:
  output_dir: outputs/experiments/wbci_shu/foundation_cross_subject_3class_v1
  checkpoint_dir: checkpoints/wbci_shu/foundation_cross_subject_3class_v1
