experiment:
  name: foundation_cross_subject
  source_config: "configs/experiments/foundation_cross_subject_3class.yaml"

# =====================================================================
# dualcd_s4_pos rescue, arm A: scale the self-supervised terms DOWN (w_dino/w_ibot 1.0 -> 0.1).
#
# WHY  Under the default weights the supervised CE contributes ~8% of the loss and the
#   DINO+iBOT terms ~85% (measured on fold 0, epoch 1). `pos` pools to 128 dims, so both
#   objectives fight over one narrow bottleneck and classification loses: 20 epochs of
#   smoke sat at 37-41% val accuracy (chance = 33.3%) with the CE stuck near ln(3),
#   and the historical 11-fold run scored 45.11%. See docs/RESULTS_TRUTH.md §4.
#   Accuracy across the three S4 variants is monotonic in feature_dim
#   (flatten 62336-d 65.99% > timepatch 1536-d 61.07% > pos 128-d 45.11%), which is what
#   a capacity-competition explanation predicts.
#
# ARM A vs ARM B  This file lowers the self-supervised weights; pos_rebalance_highsup.yaml
#   raises w_base instead. Both land supervision at 35-48% of the loss; they differ in
#   total loss magnitude (1.52 vs 11.26 at epoch 1). AdamW is largely scale-invariant so
#   they should behave similarly — running both is the cheap way to confirm that rather
#   than assume it.
#
# NOT COMPARABLE with any existing DualCD number: this is a different loss recipe.
#
# Run (fold 0 smoke first):
#   sbatch -J posA scripts/slurm/shu_gpu.sbatch \
#     code/configs/experiments/pos_rebalance_lowssl.yaml --folds-subset 0 --max-epochs 20
# =====================================================================

run_id: pos_rebalance_lowssl_v1

data:
  name: wbci_shu
  manifest: wbci_3c_processed_manifest
  status_filter: [ok]
  n_channels: 58
  n_times: 1000
  n_classes: 3
  sfreq: 250

models: [dualcd_s4_pos]

cross_subject:
  protocol: loso
  n_folds: 11
  split_seed: 0
  val_mode: subjects
  val_subject_fraction: 0.15

train:
  batch_size: 64
  lr: null
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  max_epochs: 100
  early_stopping_patience: 25
  monitor: macro_f1
  monitor_mode: max
  grad_clip_norm: 4.0
  normalization: per_sample_zscore
  num_workers: 2
  amp: false
  device: cuda
  seeds: [0]

model_params:
  dualcd_s4_pos: {d_model: 128, n_layers: 4, state_dim: 8, d_ff: 256, dropout: 0.1,
                  lambda_intra: 0.5, dino_out_dim: 256, proto_k: 5,
                  teacher_momentum: 0.996, warmup_epochs: 5,
                  view_low_band: [8.0, 13.0], view_high_band: [13.0, 30.0],
                  w_dino: 0.1, w_ibot: 0.1}

eval:
  metrics: [accuracy, balanced_accuracy, macro_f1, auc]
  calibration_metrics: [nll, brier, ece]
  report_scope: per_test_subject

checkpoints:
  keep: [best, last]
  resume: true

output:
  output_dir: outputs/experiments/wbci_shu/pos_rebalance_lowssl_v1
  checkpoint_dir: checkpoints/wbci_shu/pos_rebalance_lowssl_v1
