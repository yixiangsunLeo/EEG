experiment:
  name: "foundation_cross_subject"      # same runner as the WBCIC 821 run
  source_config: "configs/experiments/shu_cross_subject_5fold.yaml"

# =====================================================================
# SHU 2022 — CROSS-SUBJECT (subject-independent), 5-fold over subjects, 5 partitions.
#
# 25 subjects -> 5 folds of 5 test subjects. Of the 20 non-test subjects, 4 are validation
# subjects and 16 are training subjects, each contributing all 5 sessions:
#
#     16 train : 4 val : 5 test   (subjects)
#
# Why not 8:2:1. The advisor's 8:2:1 ratio (used on WBCIC 3C, 11 subjects, LOSO) cannot be
# realized here: with 5 test subjects per fold, 8:2:1 would require 40 train + 10 val = 55
# subjects and we have 25. 16:4:5 keeps the 821 run's train:val = 4:1 while giving every
# subject exactly one turn in the test set. (Advisor confirmed 2026-08-16.)
#
# SEEDS — two different things, do not conflate:
#   * `cross_subject.split_seeds: [41..45]` re-draw the SUBJECT PARTITION, so each value is
#     a different 5-fold assignment. 5 partitions x 5 folds = 25 (fold, split) cells/model.
#   * `train.seeds: [0]` is the TRAINING seed (init + batch order) and is held fixed, so
#     the spread we report is the spread of the split, not of the initialization.
#   Cell dirs are `<model>__split<ss>__fold<k>__seed<t>`; every subject is tested exactly
#   once per split seed, so "mean over 25 subjects" then "mean +/- std over 5 partitions".
#
# RECIPE — same as `paper_baseline_3c_821.yaml` (DSGNet paper, IEEE JBHI 2026 §IV-A):
#   Adam, lr 1e-4, batch 128, max 500 epochs, no scheduler / weight decay / gradient clip.
#   TWO DIFFERENCES from that run, both advisor-chosen (2026-08-16):
#     1. `early_stopping_patience: 25` (821 used 100).
#        ⚠ On the 821 run ATCNet's best epoch was 86-478 (median 406) and eegnet_official's
#        was 48-486 — with patience 25 those two will very likely stop long before their
#        real optimum. Recorded here so a weak ATCNet/EEGNet row is read as "stopped early",
#        not as "the model is bad".
#     2. `monitor: accuracy` (821 used macro_f1), so best.pt is selected differently.
#   => Numbers from this run are NOT directly comparable to paper_baseline_3c_821_v1.
#
# CURVES — per-epoch train / val / test accuracy for the 3-curve figure. The test curve is
#   MONITORING ONLY: best.pt and early stopping read the val loader alone (guard in
#   code/training/e2e_trainer.py).
#
# DualCD / DINO add-on (advisor 2026-08-21: Flatten + Transformer only; same recipe as
#   the 7 supervised models so the numbers sit on the same table):
#   dualcd_transformer     = DINO (Transformer backbone)
#   dualcd_s4_flatten      = DINO + S4 (flatten pooling)
#   Same run_id / output / checkpoint dirs: the finished 175 supervised cells are skipped
#   via result.json; only the 50 DualCD cells are trained. Do NOT change train.* above
#   or the 7 models' cell signatures will refuse to match.
#   micro_batch_per_model keeps effective batch 128 (821: flatten 32 / transformer 16;
#   those two OOM'd at batch 64 on 24 GB). DualCD also evaluates 6 DINO views per step.
#
# Run (GPU / Slurm; never on the login node):
#   python code/run.py --dry-run --config code/configs/experiments/shu_cross_subject_5fold.yaml
#   bash scripts/slurm/submit_shu_cross_subject_dualcd.sh
# =====================================================================

run_id: "shu_cross_subject_5fold_v1"

data:
  name: "shu"
  manifest: "shu_processed_manifest"
  status_filter: ["ok"]
  n_channels: 32
  n_times: 1000                  # 4 s trial @ 250 Hz (author-provided epochs)
  n_classes: 2
  sfreq: 250

models: ["eegnet_official", "eegnex", "eeg_deformer", "atcnet",
         "deepconvnet", "fbcnet", "s4erp",
         "dualcd_s4_flatten", "dualcd_transformer"]

cross_subject:
  protocol: "kfold_subject"      # 25 subjects -> 5 folds of 5 test subjects
  n_folds: 5
  val_mode: "subjects"           # validation = held-out TRAINING subjects
  n_val_subjects: 4              # 16 : 4 : 5
  split_seeds: [41, 42, 43, 44, 45]

train:
  # ---- DSGNet paper recipe (same as the 821 run): do not "improve" these ----
  optimizer: "adam"
  lr: 0.0001
  batch_size: 128
  max_epochs: 500
  weight_decay: 0.0               # not stated in the paper
  scheduler: "none"               # not stated in the paper
  grad_clip_norm: 0.0             # not stated in the paper
  # ---- early stopping (advisor 2026-08-16: patience 25, monitor accuracy) ----
  monitor: "accuracy"
  monitor_mode: "max"
  early_stopping_patience: 25
  # ---- shared across models so the table is comparable ----
  normalization: "per_sample_zscore"   # per-trial, fit-free: no statistic crosses the split
  num_workers: 2
  amp: false
  device: "cuda"
  seeds: [0]                      # training seed, fixed; the sweep is over split_seeds
  # ---- per-epoch train/val/test curves (monitoring only) ----
  curves: true
  train_eval_max_trials: 2000     # capped train subset, eval mode, for a comparable curve
  # DualCD ~66M: keep the recipe's effective batch 128 via gradient accumulation.
  # Documented the same way as paper_baseline_3c_821.yaml. Do not drop batch_size.
  micro_batch_per_model:
    dualcd_s4_flatten: 32
    dualcd_transformer: 16

model_params:
  # ===== published baselines: upstream author defaults, NOT tuned =====
  eegnet_official: {dropoutRate: 0.5, kernLength: 64, F1: 8, D: 2, F2: 16, norm_rate: 0.25}
  eegnex: {}                       # upstream exposes no structural hyperparameters
  eeg_deformer: {temporal_kernel: 51, num_kernel: 64, deformer_depth: 4,
                 heads: 16, mlp_dim: 16, dim_head: 16, deformer_dropout: 0.25}
  atcnet: {eegn_F1: 16, eegn_D: 2, eegn_kernelSize: 64, eegn_poolSize: 7,
           eegn_dropout: 0.3, attention: "mha",
           tcn_depth: 2, tcn_kernelSize: 4, tcn_filters: 32, tcn_dropout: 0.3,
           n_windows: 5, fuse: "average", use_official_l2: true}
  # ===== this project's Phase 0-2c baselines (same params as shu_phase1_baseline) =====
  deepconvnet: {dropout: 0.5, n_filters_1: 25}
  fbcnet: {n_bands: 9, band_width: 4, f_low: 4, f_high: 40, m: 32,
           temporal_segments: 4, dropout: 0.5}
  # ===== ours =====
  s4erp: {d_model: 128, n_layers: 4, state_dim: 8, d_ff: 256, dropout: 0.1}
  dualcd_s4_flatten: {d_model: 128, n_layers: 4, state_dim: 8, d_ff: 256, dropout: 0.1,
                      lambda_intra: 0.5, dino_out_dim: 256, proto_k: 5,
                      teacher_momentum: 0.996, warmup_epochs: 5,
                      view_low_band: [8.0, 13.0], view_high_band: [13.0, 30.0]}
  dualcd_transformer: {d_model: 128, n_layers: 6, n_heads: 8, d_ff: 256, dropout: 0.1,
                       lambda_intra: 0.5, dino_out_dim: 256, proto_k: 5,
                       teacher_momentum: 0.996, warmup_epochs: 5,
                       view_low_band: [8.0, 13.0], view_high_band: [13.0, 30.0]}

eval:
  metrics: ["accuracy", "balanced_accuracy", "macro_f1", "auc"]
  calibration_metrics: ["nll", "brier", "ece"]
  report_scope: "per_test_subject"

checkpoints:
  keep: ["best", "last"]
  resume: true

output:
  output_dir: "outputs/experiments/shu/cross_subject_5fold_v1"
  checkpoint_dir: "checkpoints/shu/cross_subject_5fold_v1"
